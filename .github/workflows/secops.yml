name: Secops Scanning

on:
  push:
    branches: [ "secops" ]
  pull_request:
    branches: [ "secops" ]

jobs:

  build:
    name: secops-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: gitleaks process
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Manual Trivy Setup
      uses: aquasecurity/setup-trivy@v0.2.0
      with:
        cache: true
        version: v0.68.1


    # ======================== SBOM ==========================
    - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
      uses: aquasecurity/trivy-action@0.33.1
      with:
        scan-type: 'fs'
        format: 'github'
        output: 'dependency-results.sbom.json'
        scan-ref: '.'
        github-pat: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload trivy report (SBOM) as a Github artifact
      uses: actions/upload-artifact@v4 # upload the report as an artifact and download it, for instance using the upload-artifact action
      with:
        name: trivy-sbom-report
        path: '${{ github.workspace }}/dependency-results.sbom.json'
        retention-days: 20 # 90 is the default


    # ===================== SAST (codeql) ==============================







    # ===================== IaC (trivy) ==============================
    - name: Run Trivy vulnerability scanner in IaC mode
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true
      with:
        scan-type: 'config'
        hide-progress: true
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
        skip-setup-trivy: true

    - name: Upload Trivy scan results to GitHub Security tab
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
        category: trivy-iac


    # ===================== Container Scanning (trivy) ==============================
    # - name: Build & push Docker image
    #   uses: mr-smithers-excellent/docker-build-push@v3
    #   with:
    #     image: ikpams/juice-shop
    #     tags: v1, latest
    #     registry: docker.io
    #     dockerfile: Dockerfile
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}


    # ===================== Build Docker image (local) ===================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image (no push)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: false
        load: true
        tags: ikpams/juice-shop:secops-${{ github.sha }}

    # ===================== Container Scanning (trivy image scan) ========
    - name: Trivy image scan (fail on HIGH/CRITICAL)
      uses: aquasecurity/trivy-action@0.33.1
      continue-on-error: true
      with:
        image-ref: ikpams/juice-shop:secops-${{ github.sha }}
        format: 'sarif'
        output: 'trivy-image-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        ignore-unfixed: true
        skip-setup-trivy: true

    - name: Upload Trivy image scan results to GitHub Security tab
      # if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-image-results.sarif'
        category: trivy-image
    
    - name: Upload Trivy image SARIF as artifact
      # if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-image-sarif
        path: trivy-image-results.sarif
        retention-days: 20

    # ===================== Push only on push ===================
    - name: Login to Docker Hub
      if: always() && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push image (only if scans passed)
      if: success() && github.event_name == 'push'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ikpams/juice-shop:latest
          ikpams/juice-shop:secops-${{ github.sha }}







 